<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif" fill="#eee">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bbb"/>
    </marker>
  </defs>

  <!-- JavaScript thread -->
  <rect x="40" y="40" width="360" height="480" rx="16" fill="#1e2a3a" stroke="#4aa3ff" stroke-width="3"/>
  <text x="220" y="90" text-anchor="middle" font-size="28" font-weight="bold">JavaScript thread</text>
  <text x="220" y="122" text-anchor="middle" font-size="18" fill="#bbb">your code, React, state</text>
  <rect x="80" y="160" width="280" height="56" rx="8" fill="#0f1720" stroke="#4aa3ff"/>
  <text x="220" y="196" text-anchor="middle" font-size="22" font-family="Menlo, monospace">&lt;View&gt;</text>
  <rect x="80" y="240" width="280" height="56" rx="8" fill="#0f1720" stroke="#4aa3ff"/>
  <text x="220" y="276" text-anchor="middle" font-size="22" font-family="Menlo, monospace">&lt;Text&gt;</text>
  <rect x="80" y="320" width="280" height="56" rx="8" fill="#0f1720" stroke="#4aa3ff"/>
  <text x="220" y="356" text-anchor="middle" font-size="22" font-family="Menlo, monospace">&lt;Image&gt;</text>
  <text x="220" y="440" text-anchor="middle" font-size="18" fill="#bbb">React decides WHAT</text>
  <text x="220" y="466" text-anchor="middle" font-size="18" fill="#bbb">should be on screen</text>

  <!-- Bridge / JSI -->
  <rect x="460" y="200" width="280" height="160" rx="16" fill="#2a2a1e" stroke="#ffcc4a" stroke-width="3"/>
  <text x="600" y="250" text-anchor="middle" font-size="28" font-weight="bold">Bridge / JSI</text>
  <text x="600" y="285" text-anchor="middle" font-size="18" fill="#bbb">messages between</text>
  <text x="600" y="310" text-anchor="middle" font-size="18" fill="#bbb">JavaScript and native</text>
  <text x="600" y="340" text-anchor="middle" font-size="16" fill="#888">"create a view", "text changed", "user tapped"</text>

  <line x1="400" y1="250" x2="460" y2="250" stroke="#bbb" stroke-width="3" marker-end="url(#a)"/>
  <line x1="460" y1="310" x2="400" y2="310" stroke="#bbb" stroke-width="3" marker-end="url(#a)"/>
  <line x1="740" y1="250" x2="800" y2="250" stroke="#bbb" stroke-width="3" marker-end="url(#a)"/>
  <line x1="800" y1="310" x2="740" y2="310" stroke="#bbb" stroke-width="3" marker-end="url(#a)"/>

  <!-- Native -->
  <rect x="800" y="40" width="360" height="480" rx="16" fill="#1e3a2a" stroke="#4aff9a" stroke-width="3"/>
  <text x="980" y="90" text-anchor="middle" font-size="28" font-weight="bold">Native (UI thread)</text>
  <text x="980" y="122" text-anchor="middle" font-size="18" fill="#bbb">real iOS and Android views</text>
  <rect x="840" y="160" width="280" height="56" rx="8" fill="#0f1720" stroke="#4aff9a"/>
  <text x="980" y="188" text-anchor="middle" font-size="17" font-family="Menlo, monospace">UIView</text>
  <text x="980" y="208" text-anchor="middle" font-size="17" font-family="Menlo, monospace">android.view.View</text>
  <rect x="840" y="240" width="280" height="56" rx="8" fill="#0f1720" stroke="#4aff9a"/>
  <text x="980" y="268" text-anchor="middle" font-size="17" font-family="Menlo, monospace">UILabel</text>
  <text x="980" y="288" text-anchor="middle" font-size="17" font-family="Menlo, monospace">TextView</text>
  <rect x="840" y="320" width="280" height="56" rx="8" fill="#0f1720" stroke="#4aff9a"/>
  <text x="980" y="348" text-anchor="middle" font-size="17" font-family="Menlo, monospace">UIImageView</text>
  <text x="980" y="368" text-anchor="middle" font-size="17" font-family="Menlo, monospace">ImageView</text>
  <text x="980" y="440" text-anchor="middle" font-size="18" fill="#bbb">the platform draws it,</text>
  <text x="980" y="466" text-anchor="middle" font-size="18" fill="#bbb">handles touches, scrolling</text>
</svg>
