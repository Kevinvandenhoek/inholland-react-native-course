<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Helvetica, Arial, sans-serif" fill="#eee">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bbb"/>
    </marker>
  </defs>

  <!-- boxes -->
  <g font-size="26" font-weight="bold" text-anchor="middle">
    <rect x="15"   y="140" width="170" height="90" rx="14" fill="#1e2a3a" stroke="#4aa3ff" stroke-width="3"/>
    <text x="100"  y="195">Spec</text>
    <rect x="215"  y="140" width="170" height="90" rx="14" fill="#1e2a3a" stroke="#4aa3ff" stroke-width="3"/>
    <text x="300"  y="195">Issues</text>
    <rect x="415"  y="140" width="170" height="90" rx="14" fill="#2a2a1e" stroke="#ffcc4a" stroke-width="3"/>
    <text x="500"  y="195">Plan</text>
    <rect x="615"  y="140" width="170" height="90" rx="14" fill="#2a2a1e" stroke="#ffcc4a" stroke-width="3"/>
    <text x="700"  y="195">Build</text>
    <rect x="815"  y="140" width="170" height="90" rx="14" fill="#1e3a2a" stroke="#4aff9a" stroke-width="3"/>
    <text x="900"  y="195">Review</text>
    <rect x="1015" y="140" width="170" height="90" rx="14" fill="#1e3a2a" stroke="#4aff9a" stroke-width="3"/>
    <text x="1100" y="195">Commit</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#bbb" stroke-width="3" marker-end="url(#a)">
    <line x1="185" y1="185" x2="215" y2="185"/>
    <line x1="385" y1="185" x2="415" y2="185"/>
    <line x1="585" y1="185" x2="615" y2="185"/>
    <line x1="785" y1="185" x2="815" y2="185"/>
    <line x1="985" y1="185" x2="1015" y2="185"/>
  </g>

  <!-- loop: review -> build (not right yet) -->
  <path d="M900,140 C900,80 700,80 700,140" fill="none" stroke="#ffcc4a" stroke-width="3" marker-end="url(#a)"/>
  <text x="800" y="78" text-anchor="middle" font-size="18" fill="#ffcc4a">not right? ask again</text>

  <!-- loop: commit -> issues (next issue) -->
  <path d="M1100,295 C1100,380 300,380 300,295" fill="none" stroke="#4aff9a" stroke-width="3" marker-end="url(#a)"/>
  <text x="700" y="390" text-anchor="middle" font-size="18" fill="#4aff9a">closes #12 → next issue</text>

  <!-- captions -->
  <g font-size="17" fill="#bbb" text-anchor="middle">
    <text x="100"  y="260">you write what it does</text>
    <text x="100"  y="282">the agent grills you</text>
    <text x="300"  y="260">one small task</text>
    <text x="300"  y="282">per issue</text>
    <text x="500"  y="260">agent proposes</text>
    <text x="500"  y="282">you approve</text>
    <text x="700"  y="260">the agent builds it</text>
    <text x="700"  y="282">with your context</text>
    <text x="900"  y="260">read, run, test</text>
    <text x="900"  y="282">ask, update instructions</text>
    <text x="1100" y="260">you sign off</text>
    <text x="1100" y="282">on what's in the repo</text>
  </g>

  <text x="600" y="428" text-anchor="middle" font-size="20" font-style="italic" fill="#ddd">The agent writes. You stay responsible.</text>
</svg>
